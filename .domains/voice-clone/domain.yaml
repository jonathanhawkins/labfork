# Voice Clone Research Domain Configuration
# This domain focuses on prosody and emotion conditioning in TTS systems

name: "Voice Clone Research"
slug: "voice-clone"
description: "Research prosody and emotion conditioning in Text-to-Speech systems"
longDescription: |
  A research lab focused on creating personalized voice models by recording voice samples,
  auto-labeling prosody features, fine-tuning CSM-1B models, and generating emotional speech.
  Target platforms include M4 Pro Mac (64GB) and RTX 4090 (24GB).

difficulty: "advanced"
version: "1.0"

tags:
  - tts
  - prosody
  - emotion
  - voice-cloning
  - speech-synthesis

branding:
  primaryColor: "#4ecdc4"    # Teal (lab-manager color)
  accentColor: "#66ffaa"     # Green glow
  backgroundStyle: "sky"
  backgroundColor: "#ffeef5" # Soft pink sky

scene:
  props:
    - id: supercomputer
      type: supercomputer
      position: [-6, 0, -5]
      scale: 1.3
      accentColor: 0x00ffaa

    - id: microphone
      type: microphone
      position: [-6, 0, 5]
      scale: 2.0
      accentColor: 0x4ecdc4

    - id: speaker
      type: speaker
      position: [6, 0, 5]
      scale: 2.0
      accentColor: 0xffe66d

    - id: server
      type: server
      position: [6, 0, -5]
      scale: 2.0
      accentColor: 0x3b82f6

    - id: emotion-verify
      type: emotion-verify
      position: [0, 0.3, -6]
      scale: 1.5
      accentColor: 0x4ade80

  decorations:
    plants: true
    floatingCubes: true
    particles: true

  lighting:
    ambientIntensity: 0.6
    mainLightIntensity: 0.8
    mainLightColor: "#fff5ee"

  fog:
    enabled: true
    near: 10
    far: 30

research:
  arxivCategories:
    - cs.SD    # Sound
    - cs.CL    # Computation and Language
    - eess.AS  # Audio and Speech Processing
    - cs.LG    # Machine Learning (for general techniques)

  keywords:
    - prosody conditioning TTS
    - emotion transfer voice cloning
    - disentangled speech synthesis
    - pitch contour prediction neural TTS
    - emotional speech synthesis
    - zero-shot voice cloning
    - F0 modeling neural speech
    - speaker style transfer

  additionalSources:
    - semantic-scholar
    - github
    - papers-with-code

  maxPapersPerSession: 5

evaluation:
  primaryMetric: mos
  baselineComparison: true
  metrics:
    - id: mos
      name: Mean Opinion Score
      description: Naturalness rating from human evaluators
      range: [1, 5]
      higherIsBetter: true

    - id: f0_rmse
      name: Pitch RMSE
      description: Root mean square error of F0 contour
      range: [0, 100]
      higherIsBetter: false
      unit: Hz

    - id: pesq
      name: PESQ
      description: Perceptual Evaluation of Speech Quality
      range: [-0.5, 4.5]
      higherIsBetter: true

    - id: stoi
      name: STOI
      description: Short-Time Objective Intelligibility
      range: [0, 1]
      higherIsBetter: true

    - id: speaker_sim
      name: Speaker Similarity
      description: Cosine similarity of speaker embeddings
      range: [0, 1]
      higherIsBetter: true

    - id: emotion_accuracy
      name: Emotion Accuracy
      description: Classification accuracy of target emotion
      range: [0, 100]
      higherIsBetter: true
      unit: "%"

hardware:
  gpuRequired: true
  minGpuVram: 8
  recommendedGpuVram: 24
  minRam: 32
  platforms:
    - darwin
    - linux

prompts:
  research: prompts/research.md
  implementation: prompts/implementation.md
  evaluation: prompts/evaluation.md
  preamble: |
    You are working on a Voice Clone Research project focused on prosody and
    emotion conditioning in TTS systems. The goal is to create personalized
    voice models with controllable emotional expression.
