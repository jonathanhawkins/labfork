# Robotics & Embodied AI Research Lab
# Research robot learning, manipulation, and embodied intelligence

name: "Robotics ML Lab"
slug: "robotics-ml"
description: "Research robot learning, manipulation policies, and embodied AI systems"
longDescription: |
  A research lab dedicated to advancing robotics through machine learning. Focus areas include
  imitation learning, reinforcement learning for manipulation, sim-to-real transfer,
  foundation models for robotics, and multi-modal perception for embodied agents.
difficulty: advanced

branding:
  primaryColor: "#f97316"    # Orange (robotics/industrial)
  accentColor: "#06b6d4"     # Cyan (tech/sensors)
  backgroundStyle: "space"   # Dark space theme
  backgroundColor: "#050510"

scene:
  props:
    - id: robot-arm
      type: robot-arm
      position: [-5, 0, -3]
      scale: 2.0
      accentColor: 0xf97316

    - id: sensor-array
      type: camera
      position: [-5, 2, 3]
      scale: 1.2
      accentColor: 0x06b6d4

    - id: compute-cluster
      type: supercomputer
      position: [6, 0, -5]
      scale: 1.4
      accentColor: 0x8b5cf6

    - id: sim-terminal
      type: terminal
      position: [6, 0, 5]
      scale: 1.3
      accentColor: 0x22c55e

    - id: data-server
      type: server
      position: [0, 0, -7]
      scale: 1.5
      accentColor: 0x3b82f6

  decorations:
    plants: false
    floatingCubes: true
    particles: true

  lighting:
    ambientIntensity: 0.3
    mainLightIntensity: 0.7
    mainLightColor: "#fff0e0"

  fog:
    enabled: true
    near: 12
    far: 35

research:
  arxivCategories:
    - cs.RO       # Robotics
    - cs.LG       # Machine Learning
    - cs.CV       # Computer Vision
    - cs.AI       # Artificial Intelligence

  keywords:
    - robot learning manipulation
    - imitation learning robotics
    - sim-to-real transfer
    - reinforcement learning robot control
    - vision-language models robotics
    - foundation models embodied AI
    - dexterous manipulation learning
    - robot motion planning neural
    - humanoid robot control
    - multi-modal robot perception

  additionalSources:
    - semantic-scholar
    - github
    - papers-with-code

  maxPapersPerSession: 6

evaluation:
  primaryMetric: success_rate
  baselineComparison: true
  metrics:
    - id: success_rate
      name: Task Success Rate
      description: Percentage of successful task completions
      range: [0, 100]
      higherIsBetter: true
      unit: "%"

    - id: sim_to_real_gap
      name: Sim-to-Real Gap
      description: Performance difference between simulation and real
      range: [0, 100]
      higherIsBetter: false
      unit: "%"

    - id: sample_efficiency
      name: Sample Efficiency
      description: Number of demonstrations needed for learning
      range: [1, 10000]
      higherIsBetter: false
      unit: "demos"

    - id: generalization
      name: Generalization Score
      description: Performance on unseen objects/environments
      range: [0, 100]
      higherIsBetter: true
      unit: "%"

    - id: inference_time
      name: Inference Time
      description: Time to compute action from observation
      range: [0, 1000]
      higherIsBetter: false
      unit: "ms"

hardware:
  gpuRequired: true
  minGpuVram: 12
  recommendedGpuVram: 24
  minRam: 64
  platforms:
    - linux
    - darwin

prompts:
  research: prompts/research.md
  implementation: prompts/implementation.md
  evaluation: prompts/evaluation.md
  preamble: |
    You are working on a Robotics ML Research Lab focused on developing
    learning-based approaches for robot manipulation and embodied AI.
    Prioritize sim-to-real transfer, sample efficiency, and safety.

tags:
  - robotics
  - manipulation
  - reinforcement-learning
  - imitation-learning
  - embodied-ai
  - computer-vision

version: "1.0"
