    - metric: "People with light"
      current: 0
      target: 1000000000
    - metric: "Labs working on project"
      current: 0
      target: 100
    - metric: "Units deployed"
      current: 0
      target: 10000
    - metric: "Partner organizations"
      current: 0
      target: 50
