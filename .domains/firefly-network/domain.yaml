# Firefly Network - Solar-Powered Mesh Lighting for 1 Billion People
# Bringing light, power, and connectivity to underserved communities

name: "The Firefly Network"
slug: "firefly-network"
description: "Build solar-powered mesh lights that bring illumination, power, and connectivity to communities worldwide"
longDescription: |
  The Firefly Network is an ambitious open-source hardware project to create ultra-low-cost
  (<$25) solar-powered lights that form autonomous mesh networks. Each "firefly" unit provides
  LED lighting, phone charging, and mesh connectivity to neighbors up to 1km away.

  Using swarm intelligence algorithms, the network self-organizes, shares power during
  emergencies, and enables information sharing in off-grid communities. The goal is to
  bring light, power, and connection to the 1.2 billion people currently without electricity.

  This is not a concept - we're building the first prototype THIS MONTH.

difficulty: "intermediate"
version: "0.1.0"
featured: true

tags:
  - solar-energy
  - mesh-networking
  - swarm-intelligence
  - embedded-systems
  - open-hardware
  - humanitarian-tech
  - iot
  - low-power
  - off-grid
  - impact

branding:
  primaryColor: "#FFB84D"      # Warm amber/gold (firefly glow)
  accentColor: "#1a1a2e"       # Deep purple/blue (night sky)
  secondaryColor: "#FF6B35"    # Sunset orange
  backgroundStyle: "gradient"
  backgroundColor: "#0f0f1a"   # Deep night
  glowColor: "#FFD700"         # Golden glow

scene:
  props:
    - id: solar-panel
      type: terminal
      position: [-6, 0, -4]
      scale: 1.5
      accentColor: 0xFFB84D
      label: "Solar Charging"

    - id: mesh-hub
      type: server
      position: [6, 0, -4]
      scale: 1.8
      accentColor: 0x3b82f6
      label: "Mesh Network"

    - id: led-array
      type: speaker
      position: [-6, 0, 5]
      scale: 1.5
      accentColor: 0xFFD700
      label: "LED Lighting"

    - id: microcontroller
      type: supercomputer
      position: [6, 0, 5]
      scale: 1.2
      accentColor: 0x22c55e
      label: "ESP32-C6"

    - id: swarm-brain
      type: emotion-verify
      position: [0, 0.3, -6]
      scale: 1.6
      accentColor: 0xFF6B35
      label: "Swarm AI"

  decorations:
    plants: false
    floatingCubes: true
    particles: true
    fireflies: true  # Custom decoration

  lighting:
    ambientIntensity: 0.3
    mainLightIntensity: 0.6
    mainLightColor: "#FFB84D"

  fog:
    enabled: true
    near: 8
    far: 25
    color: "#0f0f1a"

research:
  arxivCategories:
    - cs.NI       # Networking and Internet Architecture
    - cs.DC       # Distributed, Parallel, and Cluster Computing
    - cs.MA       # Multiagent Systems
    - physics.app-ph  # Applied Physics
    - eess.SP     # Signal Processing
    - cs.SY       # Systems and Control

  keywords:
    - mesh networking protocol low power
    - solar energy harvesting optimization
    - swarm intelligence coordination
    - wireless sensor networks
    - MPPT algorithm small solar panel
    - Thread mesh networking
    - LoRa long range communication
    - battery management system
    - embedded systems optimization
    - distributed consensus algorithms
    - energy-aware routing protocols
    - light quality human factors

  additionalSources:
    - semantic-scholar
    - github
    - papers-with-code
    - hackaday

  maxPapersPerSession: 8

  # Initial papers to implement
  seedPapers:
    - title: "Thread: A Low-Power Mesh Network Protocol"
      focus: "Understanding Thread mesh for ESP32-C6"
    - title: "MPPT Algorithms for Small-Scale Solar Applications"
      focus: "Optimizing power harvesting for <20W panels"
    - title: "Swarm Robotics: From Natural to Artificial Systems"
      focus: "Applying swarm intelligence to mesh coordination"
    - title: "Energy-Aware Routing in Wireless Sensor Networks"
      focus: "Battery-efficient mesh routing strategies"

evaluation:
  primaryMetric: lumens_per_watt
  baselineComparison: true
  metrics:
    - id: lumens_per_watt
      name: Lumens per Watt
      description: Light output efficiency
      range: [0, 200]
      higherIsBetter: true
      unit: "lm/W"

    - id: network_uptime
      name: Network Uptime
      description: Percentage of time mesh network is available
      range: [0, 100]
      higherIsBetter: true
      unit: "%"

    - id: battery_cycles
      name: Battery Cycle Life
      description: Number of charge/discharge cycles before 80% capacity
      range: [0, 5000]
      higherIsBetter: true
      unit: "cycles"

    - id: coverage_area
      name: Coverage Area
      description: Area covered by mesh network
      range: [0, 10000]
      higherIsBetter: true
      unit: "m2"

    - id: unit_cost
      name: Unit Cost
      description: Bill of materials cost per unit
      range: [0, 100]
      higherIsBetter: false
      unit: "USD"

    - id: charge_time
      name: Full Charge Time
      description: Hours to fully charge from solar
      range: [0, 24]
      higherIsBetter: false
      unit: "hours"

    - id: runtime
      name: Runtime on Full Charge
      description: Hours of light at medium brightness
      range: [0, 24]
      higherIsBetter: true
      unit: "hours"

    - id: mesh_range
      name: Mesh Communication Range
      description: Maximum distance between nodes
      range: [0, 2000]
      higherIsBetter: true
      unit: "meters"

hardware:
  gpuRequired: false
  minGpuVram: 0
  recommendedGpuVram: 0
  minRam: 8
  platforms:
    - darwin
    - linux
    - win32

# Hardware BOM Target
bom:
  target_cost: 25
  components:
    - name: ESP32-C6 Module
      cost: 3.50
      purpose: "MCU with Thread/WiFi/BLE"
    - name: Solar Panel (5W)
      cost: 4.00
      purpose: "Energy harvesting"
    - name: LiFePO4 Battery (3.2V 6Ah)
      cost: 6.00
      purpose: "Energy storage"
    - name: LED Array (1000lm)
      cost: 2.50
      purpose: "Illumination"
    - name: MPPT Charge Controller
      cost: 2.00
      purpose: "Solar charging optimization"
    - name: PCB + Components
      cost: 3.00
      purpose: "Electronics"
    - name: Enclosure (IP65)
      cost: 2.50
      purpose: "Weather protection"
    - name: Misc (connectors, wires)
      cost: 1.50
      purpose: "Assembly"

# Project roadmap
roadmap:
  phase1:
    name: "Prototype"
    duration: "Month 1-3"
    status: "active"
    goals:
      - "Design PCB schematic v1"
      - "Implement Thread mesh on ESP32-C6"
      - "Basic MPPT algorithm"
      - "Order first prototype parts"

  phase2:
    name: "Field Test"
    duration: "Month 4-6"
    status: "planned"
    goals:
      - "Build 10 units"
      - "Deploy in test location"
      - "Collect real-world data"
      - "Iterate on design"

  phase3:
    name: "Pilot"
    duration: "Month 7-12"
    status: "planned"
    goals:
      - "Partner with NGO"
      - "Deploy 100 units"
      - "Document impact"
      - "Refine for manufacturing"

  phase4:
    name: "Scale"
    duration: "Year 2+"
    status: "planned"
    goals:
      - "Manufacturing partnerships"
      - "Distribution network"
      - "Reach 10,000 units"
      - "Open source everything"

prompts:
  research: prompts/research.md
  implementation: prompts/implementation.md
  evaluation: prompts/evaluation.md
  preamble: |
    You are working on The Firefly Network - an open-source project to bring
    solar-powered mesh lighting to communities without electricity.

    Design constraints:
    - Total BOM cost must be under $25
    - Must work in harsh conditions (rain, dust, heat)
    - Battery must last 12+ hours at medium brightness
    - Mesh range must be 500m+ between nodes
    - Must be repairable with basic tools

    This is humanitarian technology - prioritize reliability, durability, and
    accessibility over cutting-edge features. Every design decision should
    consider the end user: families in off-grid communities who need light
    to study, cook, and feel safe after dark.

# Impact metrics to track
impact:
