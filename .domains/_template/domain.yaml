# Domain Plugin Template
# Copy this directory to .domains/your-domain-name/ and customize

name: "My Research Lab"
slug: "my-domain"  # CHANGE THIS: lowercase, hyphens only
description: "A custom research domain for [your topic]"

# Branding - customize colors and style
branding:
  primaryColor: "#3b82f6"    # Main brand color (blue)
  accentColor: "#22c55e"      # Highlight color (green)
  backgroundStyle: "sky"      # Options: sky | space | grid | gradient | minimal

# 3D Scene - add props that represent your domain
scene:
  props:
    - id: computer
      type: supercomputer
      position: [-6, 0, -5]
      scale: 1.3
    # Add more props as needed:
    # - id: analysis
    #   type: terminal
    #   position: [0, 0, -6]

  # Optional decorations
  decorations:
    plants: true
    floatingCubes: false
    particles: true

# Research Configuration
research:
  # arXiv categories to monitor (see https://arxiv.org/category_taxonomy)
  arxivCategories:
    - cs.LG     # Machine Learning
    - cs.AI     # Artificial Intelligence

  # Keywords for paper search
  keywords:
    - machine learning
    - deep learning
    - neural networks

  # Optional: additional sources
  # additionalSources:
  #   - semantic-scholar
  #   - github
  #   - papers-with-code

  # Optional: limit papers per session
  # maxPapersPerSession: 20

# Evaluation Metrics (optional)
# Define how to measure success in your domain
evaluation:
  primaryMetric: accuracy
  metrics:
    - id: accuracy
      name: Accuracy
      description: Overall model accuracy
      range: [0, 100]
      higherIsBetter: true
      unit: "%"

    - id: latency
      name: Inference Latency
      description: Time to process one sample
      range: [0, 1000]
      higherIsBetter: false
      unit: "ms"

# Hardware Requirements (optional)
# hardware:
#   gpuRequired: false
#   minGpuVram: 8
#   recommendedGpuVram: 16
#   minRam: 16
#   platforms:
#     - darwin
#     - linux
#     - win32

# Prompt Templates (optional)
# prompts:
#   research: prompts/research.md
#   implementation: prompts/implementation.md
#   evaluation: prompts/evaluation.md
#   preamble: "You are an AI research assistant..."

# Metadata
tags:
  - template
  - starter
version: "1.0.0"
difficulty: beginner
