name = "labfork-agents"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "labfork-agents-db"
database_id = "966bc5ec-afda-4499-ad4c-5548d1a8ec79"

# Workers AI binding - REMOVED
# We now use the distributed compute network (4090 GPU, contributors, WebGPU)
# instead of Workers AI to avoid credit costs.
# [ai]
# binding = "AI"

# Workflows configuration
[[workflows]]
name = "manager-workflow"
binding = "MANAGER_WORKFLOW"
class_name = "ManagerWorkflow"

[[workflows]]
name = "worker-workflow"
binding = "WORKER_WORKFLOW"
class_name = "WorkerWorkflow"

# Cron Triggers for autonomous agent scheduling
# This is now FREE - no Workers AI used, all inference on compute network
[triggers]
crons = ["*/15 * * * *"]  # Every 15 minutes - orchestration only

# Environment variables (override in wrangler.toml or dashboard)
[vars]
ENVIRONMENT = "development"

# Secrets (set via: npx wrangler secret put ADMIN_API_KEY)
# ADMIN_API_KEY: Required for admin endpoints (POST /tasks, GET /devices, DELETE /tasks/:id)
# When not set, admin endpoints are open (dev mode)
