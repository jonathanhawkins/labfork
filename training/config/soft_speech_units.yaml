# Soft Speech Units Training Configuration
# Based on "A Comparison of Discrete and Soft Speech Units for Improved Voice Conversion" (ICASSP 2022)

# Model configuration
model:
  hubert_model: "facebook/hubert-base-ls960"
  hubert_layer: 6  # Layer to extract features from
  num_units: 100  # Soft unit vocabulary size (k-means clusters)
  soft_unit_dim: 256
  hidden_dim: 512

  # Prosody encoder
  prosody_dim: 4  # F0, energy, duration, vuv
  prosody_hidden_dim: 256

  # Decoder
  decoder_layers: 4
  decoder_heads: 8
  decoder_ffn_dim: 2048

  # Speaker
  num_speakers: 100
  speaker_embed_dim: 256

  # Output
  mel_dim: 80
  output_dim: 2048

  # Temperature for soft assignment
  temperature: 1.0
  dropout: 0.1

# Audio settings
audio:
  sample_rate: 16000  # HuBERT expects 16kHz
  hop_length: 320  # 20ms at 16kHz
  n_fft: 1024
  n_mels: 80

# Training settings
training:
  epochs: 50
  batch_size: 16
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_epochs: 3
  gradient_clip: 1.0

  # Loss weights
  l1_weight: 1.0
  l2_weight: 1.0
  entropy_weight: 0.01  # Encourage peaked soft distributions

  # Optimizer
  optimizer: "adamw"
  betas: [0.9, 0.98]

  # Scheduler
  scheduler: "cosine"
  min_lr: 1.0e-6

  # Early stopping
  early_stopping_patience: 10
  early_stopping_min_delta: 0.001

# Data settings
data:
  train_manifest: "../data/splits/train.json"
  val_manifest: "../data/splits/val.json"
  test_manifest: "../data/splits/test.json"
  num_workers: 4
  max_duration: 15.0  # Max audio duration in seconds

# Checkpoint settings
checkpoints:
  save_dir: "../checkpoints/soft_speech_units"
  save_every_n_epochs: 5
  keep_top_k: 3

# Logging
logging:
  log_every_n_steps: 100
  wandb_project: "voice-clone-soft-units"
  wandb_entity: null

# Hardware
hardware:
  fp16: true
  compile: false  # torch.compile (experimental)
  device: "auto"  # auto, cuda, mps, cpu
