# PE-wav2vec: Prosody-Enhanced wav2vec 2.0 Configuration
#
# Based on "PE-Wav2vec: A Prosody-Enhanced Speech Model for Self-Supervised
# Prosody Learning in TTS" (IEEE/ACM TASLP 2024)
# https://ieeexplore.ieee.org/document/10645206/
#
# Key innovation: LPC residual supervision on initial transformer blocks
# to learn prosodic features in a self-supervised manner.

model:
  # Base wav2vec 2.0 model
  wav2vec_model: "facebook/wav2vec2-base-960h"
  freeze_feature_extractor: true
  freeze_upper_layers: false

  # Prosody supervision layers (initial transformer blocks)
  # Paper suggests layers 1-4 for prosody learning
  prosody_layers: [1, 2, 3, 4]

  # LPC settings for residual extraction
  lpc_order: 16  # Standard LPC order for speech
  lpc_frame_length_ms: 25.0
  lpc_hop_length_ms: 10.0

  # Model dimensions
  hidden_dim: 768  # wav2vec2-base hidden dimension
  prosody_dim: 256  # Learned prosody representation
  lpc_residual_dim: 64  # Target dimension for LPC prediction

  # Loss weights
  lpc_loss_weight: 0.1  # Weight for LPC auxiliary loss
  contrastive_loss_weight: 1.0

  # Prosody embedding
  prosody_pooling: "attention"  # mean, attention, or first
  num_prosody_heads: 4

  # Training
  dropout: 0.1
  layer_drop: 0.05

  # Audio
  sample_rate: 16000
  normalize_audio: true

  # Output for CSM
  output_dim: 2048
  num_prefix_tokens: 4

data:
  # Training manifest (JSON list of {audio_path: str, ...})
  manifest: "../data/manifest.json"

  # Audio length constraints
  max_audio_len_seconds: 10.0
  min_audio_len_seconds: 1.0

training:
  # Optimization
  batch_size: 16  # Adjust based on GPU memory
  learning_rate: 1e-4
  weight_decay: 0.01
  warmup_steps: 2000
  max_steps: 100000

  # Gradient clipping
  max_grad_norm: 1.0

  # Logging and checkpointing
  log_every: 100
  eval_every: 2000
  save_every: 5000
  checkpoint_dir: "../checkpoints/pe_wav2vec"

  # Mixed precision (RTX 4090)
  use_amp: true
  amp_dtype: "float16"

# Hardware-specific configs
rtx_4090:
  batch_size: 32
  use_amp: true
  gradient_checkpointing: true

m4_pro:
  batch_size: 8
  use_amp: false  # MPS doesn't support amp well
  gradient_checkpointing: false
