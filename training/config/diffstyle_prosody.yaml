# DiffStyleTTS Hierarchical Prosody Training Configuration
# Based on: https://arxiv.org/abs/2412.03388

# Model Architecture
model:
  # Mel-spectrogram settings
  mel_dim: 80

  # Global Style Token (GST) settings
  gst_num_tokens: 10
  gst_embedding_dim: 256
  gst_num_heads: 4

  # Text encoder settings
  text_hidden_dim: 256
  text_num_layers: 4
  text_num_heads: 2

  # Phoneme-level prosody settings
  pitch_dim: 1
  energy_dim: 1
  duration_dim: 1
  prosody_dim: 3

  # Prosody embedding
  prosody_hidden_dim: 256
  prosody_embedding_dim: 256

  # Denoiser settings
  denoiser_channels: 3
  denoiser_num_layers: 12
  denoiser_kernel_size: 3
  use_bidirectional_dilated_conv: true

  # Guiding scale defaults
  default_eta: 3.0        # CFG guidance scale (diversity vs quality)
  default_gamma: 0.5      # Dynamic thresholding (distortion prevention)
  max_eta: 7.0            # Maximum η before quality degradation
  percentile_clip: 0.99   # Percentile for dynamic thresholding

  # Training settings
  dropout: 0.1
  unconditional_prob: 0.1  # 10% unconditional for CFG training

  # Output settings
  output_dim: 2048
  num_prosody_tokens: 4
  use_length_regulator: true

# Training Configuration
training:
  # Basic settings
  batch_size: 8
  num_epochs: 100
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 4000

  # Gradient settings
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0

  # Diffusion training
  num_diffusion_steps: 1000
  noise_schedule: "cosine"  # linear, cosine, sqrt_linear

  # Loss weights
  loss:
    diffusion_weight: 1.0
    prosody_weight: 1.0
    style_weight: 0.1
    kl_weight: 0.01

  # Optimizer
  optimizer: "adamw"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

  # Learning rate schedule
  lr_scheduler: "cosine_with_restarts"
  num_warmup_steps: 4000
  num_cycles: 1

  # Mixed precision
  fp16: false
  bf16: false  # Use bf16 if available (better for gradients)

  # Data augmentation
  augmentation:
    pitch_shift_range: [-2, 2]  # semitones
    speed_range: [0.9, 1.1]     # tempo change
    noise_snr_range: [20, 40]   # dB

# Inference Configuration
inference:
  num_diffusion_steps: 50
  ode_method: "euler"  # euler, midpoint, rk4

  # Default guiding scales (can be overridden)
  eta: 3.0              # CFG guidance scale
  gamma: 0.5            # Dynamic thresholding
  temperature: 1.0      # Sampling temperature

# Data Configuration
data:
  # Paths (relative to project root)
  train_manifest: "data/splits/train_manifest.json"
  val_manifest: "data/splits/val_manifest.json"
  test_manifest: "data/splits/test_manifest.json"

  # Audio settings
  sample_rate: 24000
  hop_length: 256
  win_length: 1024
  n_fft: 1024
  n_mels: 80

  # Processing
  max_audio_length: 15.0  # seconds
  min_audio_length: 0.5   # seconds

  # Prosody extraction
  pitch_extractor: "parselmouth"  # parselmouth, pyworld, crepe
  energy_method: "rms"            # rms, intensity
  duration_source: "forced_alignment"  # forced_alignment, model

# Checkpointing
checkpoint:
  save_dir: "checkpoints/diffstyle_prosody"
  save_every_n_epochs: 5
  keep_n_checkpoints: 3
  resume_from: null

# Logging
logging:
  log_dir: "logs/diffstyle_prosody"
  log_every_n_steps: 100
  eval_every_n_steps: 500
  use_wandb: false
  wandb_project: "voice-clone-prosody"
  wandb_entity: null

# Hardware
hardware:
  # M4 Pro Mac settings (64GB)
  device: "mps"  # cpu, cuda, mps
  num_workers: 4
  pin_memory: true

  # RTX 4090 settings (uncomment to use)
  # device: "cuda"
  # num_workers: 8
  # pin_memory: true
  # gradient_checkpointing: true
