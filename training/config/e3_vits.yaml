# E3-VITS: Batch-Permuted Style Perturbation Configuration
# Based on E3-VITS (ICML 2023)
# Paper: https://openreview.net/forum?id=qL47xtuEuv

# Model Architecture
input_dim: 768            # HuBERT/wav2vec2 feature dimension
hidden_dim: 512           # Hidden layer dimension
style_dim: 256            # Style embedding dimension
speaker_dim: 256          # Speaker embedding dimension
emotion_dim: 256          # Emotion embedding dimension
output_dim: 2048          # Output dimension for CSM integration

# Flow Module Settings (VITS-style normalizing flow)
flow_hidden_dim: 192      # Flow hidden dimension
flow_kernel_size: 5       # Convolution kernel size
flow_dilation_rate: 1     # Dilation rate for WaveNet
flow_num_layers: 4        # Number of flow layers
flow_num_flows: 4         # Number of coupling layers

# Batch Permutation Settings
permutation_probability: 0.5    # Probability of permuting each sample
permute_speaker: true           # Permute speaker embeddings
permute_emotion: true           # Permute emotion embeddings
separate_permutation: true      # Separate permutation for speaker/emotion

# Style Encoder Settings
num_emotions: 8                 # Number of emotion categories
use_emotion_embedding: true     # Use learned emotion embeddings
use_reference_encoder: true     # Extract emotion from reference audio

# Discriminator Settings
use_discriminator: true
discriminator_hidden_dim: 256
discriminator_num_layers: 3
use_gradient_penalty: true
gradient_penalty_weight: 10.0

# Loss Weights
adversarial_weight: 1.0         # Weight for adversarial loss
reconstruction_weight: 1.0      # Weight for reconstruction loss
style_consistency_weight: 0.5   # Weight for style consistency loss
kl_weight: 0.01                 # Weight for KL divergence (VAE)

# Training Settings
warmup_steps: 1000              # Steps before full permutation strength
num_prefix_tokens: 4            # Number of prosody prefix tokens

# Dataset Settings (for training script)
num_speakers: 1000              # Number of speakers in dataset
num_samples: 10000              # Number of training samples

# Training Hyperparameters
num_epochs: 100
batch_size: 32
learning_rate: 0.0001
weight_decay: 0.01

# Checkpoint Settings
checkpoint_dir: ../checkpoints/e3_vits
save_every: 10                  # Save checkpoint every N epochs

# Evaluation
eval_every: 5                   # Evaluate every N epochs

# Hardware
use_amp: false                  # Use automatic mixed precision
num_workers: 4                  # DataLoader workers

# Logging
log_every: 10                   # Log every N batches
