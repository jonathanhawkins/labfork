# LoRA Fine-Tuning Configuration for RTX 4090 (24GB)
# Optimized for 450 samples from LibriTTS
#
# DeepSeek techniques applied:
# 1. LoRA with r=16 (optimal for 100-500 samples)
# 2. Multi-Token Prediction for denser signal
# 3. DeepSeek LR schedule (warmup -> stable -> decay)
# 4. High regularization (weight decay, dropout, label smoothing)
# 5. Data augmentation for effective 2x dataset expansion
#
# Expected results:
#   - Train loss: ~2.0-2.5 (higher than full FT, but healthy)
#   - Val loss: ~2.5-3.0 (close to train)
#   - Overfit ratio: 1.0-1.2x (vs 5x with full fine-tuning)

# ============== Model ==============
model_path: "../models/csm-1b"

# ============== LoRA Configuration ==============
use_lora: true
lora_r: 16                    # r=16 for 450 samples (r=8 for <100, r=32 for >1000)
lora_alpha: 32                # Standard 2x scaling
lora_dropout: 0.1             # Moderate dropout
lora_target_modules:
  - "q_proj"
  - "v_proj"
  - "k_proj"                  # Include for more capacity

# ============== Data ==============
data_dir: "../data/training"
max_audio_length_ms: 30000

# ============== Data Augmentation ==============
use_augmentation: true
augment_probability: 0.6      # 60% augmentation rate

# Speed perturbation
speed_perturb_enabled: true
speed_perturb_min: 0.9
speed_perturb_max: 1.1

# Pitch shifting
pitch_shift_enabled: true
pitch_shift_semitones_min: -2
pitch_shift_semitones_max: 2

# Time masking
time_mask_enabled: true
time_mask_ratio: 0.1

# Noise injection
noise_enabled: true
noise_snr_db_min: 25
noise_snr_db_max: 40

# Volume perturbation
volume_enabled: true
volume_min: 0.85
volume_max: 1.15

# ============== DeepSeek LR Schedule ==============
learning_rate: 2.0e-4         # LoRA can handle higher LR
warmup_steps: 150             # ~10% of total steps
stable_steps: 300             # Hold at peak
min_lr_ratio: 0.01            # Decay to 1%

# ============== Optimizer (DeepSeek settings) ==============
weight_decay: 0.15            # Strong but not aggressive
adam_beta1: 0.9
adam_beta2: 0.95              # DeepSeek uses 0.95 (more momentum)

# ============== Regularization ==============
max_grad_norm: 0.5            # Tight clipping
label_smoothing: 0.1

# ============== Multi-Token Prediction ==============
use_mtp: false                # Disabled for now - vocab size mismatch issue
mtp_tokens: 2                 # Conservative: 2 tokens ahead
mtp_weight: 0.1               # 10% of total loss

# ============== Training ==============
batch_size: 4                 # Conservative for stability
gradient_accumulation: 4      # Effective batch = 16
num_epochs: 50
precision: "fp32"             # Use fp32 for compatibility with CSM codec model

# ============== Early Stopping ==============
early_stopping_patience: 10   # Stop if val_loss doesn't improve for 10 epochs
early_stopping_min_delta: 0.01

# ============== Evaluation & Logging ==============
eval_every: 50                # Validate frequently
save_every: 200
log_every: 10

# ============== Hardware ==============
device: "cuda"
gradient_checkpointing: false    # Disabled - conflicts with LoRA gradient flow
num_workers: 2

# ============== Output ==============
output_dir: "../models/checkpoints/csm_lora_450"

# ============== Expected Performance ==============
# RTX 4090 with LoRA:
#   - Trainable params: ~16M (1.1% of 1.5B)
#   - VRAM usage: ~10-14GB
#   - Training time: ~20-40 minutes for 50 epochs
#   - Samples/sec: ~15-25
