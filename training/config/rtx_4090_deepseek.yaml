# Enhanced Training Configuration - RTX 4090 (24GB)
# With DeepSeek Techniques for Faster Convergence

# Model
model_path: "../models/csm-1b"  # Local path to downloaded model

# Data
data_dir: "../data/training"
max_audio_length_ms: 30000

# ============== DeepSeek Enhancements ==============

# Multi-Token Prediction (MTP)
# Predicts multiple future tokens for denser training signal
use_mtp: true
mtp_tokens: 4  # Predict 4 tokens ahead (DeepSeek uses 1-6)

# Learning Rate Schedule (DeepSeek-style)
# Warmup -> Stable -> Cosine decay
learning_rate: 3.0e-5  # Higher LR for faster convergence on 4090
warmup_steps: 500
stable_steps: 500  # Hold at peak LR before decay
min_lr_ratio: 0.1  # Decay to 10% of peak

# Optimizer (DeepSeek settings)
weight_decay: 0.1  # Higher than typical
adam_beta1: 0.9
adam_beta2: 0.95  # DeepSeek uses 0.95 (more momentum)

# ============== RTX 4090 Optimizations ==============

# RTX 4090 has 24GB VRAM - can handle larger batches
batch_size: 8  # Larger batch for faster training
gradient_accumulation: 4  # Effective batch = 32

# FP16 for 2x speedup on Ampere/Ada
precision: "fp16"

# torch.compile for CUDA
use_compile: true

# Multi-worker data loading
num_workers: 4

# Device
device: "cuda"

# ============== Training Settings ==============

num_epochs: 50  # Full training run
max_grad_norm: 1.0

# Gradient checkpointing (saves memory for larger batches)
gradient_checkpointing: true

# ============== Logging & Checkpointing ==============

output_dir: "../models/checkpoints/voice_deepseek_4090"
log_every: 10
eval_every: 100
save_every: 500

# WandB (optional)
use_wandb: false
wandb_project: "voice-clone"

# ============== Expected Performance ==============
# RTX 4090 with these settings:
#   - ~8-12 samples/second
#   - ~18-22GB VRAM usage
#   - ~1-2 hours for 50 epochs on 60min data
#   - MTP should improve convergence by ~20-30%
