# Enhanced Training Configuration - M4 Pro (64GB)
# With DeepSeek Techniques for Faster Convergence

# Model
model_path: "sesame/csm-1b"

# Data
data_dir: "../data/splits"
max_audio_length_ms: 30000

# ============== DeepSeek Enhancements ==============

# Multi-Token Prediction (MTP)
# Predicts multiple future tokens for denser training signal
use_mtp: true
mtp_tokens: 4  # Predict 4 tokens ahead (DeepSeek uses 1-6)

# Learning Rate Schedule (DeepSeek-style)
# Warmup -> Stable -> Cosine decay
learning_rate: 2.0e-5  # Slightly higher with MTP
warmup_steps: 500
stable_steps: 500  # Hold at peak LR before decay
min_lr_ratio: 0.1  # Decay to 10% of peak

# Optimizer (DeepSeek settings)
weight_decay: 0.1  # Higher than typical
adam_beta1: 0.9
adam_beta2: 0.95  # DeepSeek uses 0.95 (more momentum)

# ============== M4 Pro Optimizations ==============

# M4 Pro has 64GB unified memory - can use larger batches
batch_size: 12  # Larger than 4090 version
gradient_accumulation: 2  # Effective batch = 24

# M4 works well with FP32 (unified memory reduces precision benefit)
precision: "fp32"

# torch.compile for MPS
use_compile: true

# No multiprocessing on MPS
num_workers: 0

# Device
device: "mps"

# ============== Training Settings ==============

num_epochs: 50
max_grad_norm: 1.0

# Gradient checkpointing (saves memory, slight speed cost)
gradient_checkpointing: true

# ============== Logging & Checkpointing ==============

output_dir: "../models/checkpoints/voice_deepseek_v1"
log_every: 10
eval_every: 100
save_every: 500

# WandB (optional)
use_wandb: false
wandb_project: "voice-clone"

# ============== Expected Performance ==============
# M4 Pro with these settings:
#   - ~2-3 samples/second
#   - ~25-35GB memory usage
#   - ~4-6 hours for 50 epochs on 60min data
#   - MTP should improve convergence by ~20-30%
