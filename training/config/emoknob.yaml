# EmoKnob Training Configuration
# Direction Vector Emotion Control
#
# Based on: arXiv:2410.00316 "EmoKnob: Enhance Voice Cloning with Fine-Grained
#           Emotion Control" (EMNLP 2024)
#
# Key technique: Extract emotion direction vectors from neutral/emotional pairs,
# then manipulate speaker embeddings with scalar intensity control.

# Model Configuration
model:
  # Embedding dimensions
  input_dim: 768            # Input feature dim (wav2vec2/HuBERT)
  speaker_dim: 256          # Speaker embedding dimension
  hidden_dim: 512           # Hidden layer dimension
  output_dim: 2048          # Output to match prosody encoder

  # Direction vector settings
  num_pairs_for_extraction: 5     # Number of (emotional, neutral) pairs
  normalize_direction: true       # Normalize direction vectors

  # Intensity control
  default_intensity: 0.7    # Default alpha when not specified
  min_intensity: 0.0        # Minimum intensity (neutral)
  max_intensity: 2.0        # Maximum intensity (strong emotion)

  # Text-based emotion extraction
  use_text_emotion: true
  text_embedding_dim: 384   # Sentence transformer dimension
  retrieval_topk: 5         # Top-k retrieval results

  # Architecture
  dropout: 0.1
  use_layer_norm: true

  # Pre-computed directions
  direction_cache_path: "../checkpoints/emoknob/directions"

  # Number of emotions
  num_emotions: 8

  # Integration
  num_prosody_tokens: 4

# Data Configuration
train_manifest: "../data/emotion_train.json"
val_manifest: "../data/emotion_val.json"
max_audio_length: 500
max_seq_length: 1000

# Feature extraction
feature_extractor: "wav2vec2"  # wav2vec2, hubert, or mel
feature_model: "facebook/wav2vec2-base-960h"

# Training
epochs: 100
batch_size: 16
learning_rate: 1.0e-4
warmup_steps: 1000
weight_decay: 0.01

# Loss weights
direction_weight: 1.0
contrastive_weight: 0.5
consistency_weight: 0.3

# Two-phase training
# Phase 1: Extract direction vectors from paired samples
extraction_epochs: 10
extraction_batch_size: 8

# Phase 2: Fine-tune with emotion control
finetune_epochs: 90
finetune_lr: 5.0e-5

# Optimizer
optimizer: "adamw"
adam_beta1: 0.9
adam_beta2: 0.999
gradient_clip: 1.0

# Checkpointing
checkpoint_dir: "../checkpoints/emoknob"
save_every: 5
log_every: 100
eval_every: 500

# Hardware
device: "cuda"
num_workers: 4
gradient_accumulation: 1
use_amp: true

# Evaluation
eval_intensities: [0.0, 0.3, 0.5, 0.7, 1.0, 1.3, 1.5]
eval_emotions: ["happy", "sad", "angry", "surprised", "calm", "fearful"]

# Emotion descriptions for text-based control
emotion_descriptions:
  happy: "expressing joy and happiness"
  sad: "expressing sadness and sorrow"
  angry: "expressing anger and frustration"
  surprised: "expressing surprise and astonishment"
  calm: "speaking calmly and peacefully"
  fearful: "expressing fear and anxiety"
  disgusted: "expressing disgust and contempt"
  excited: "expressing excitement and enthusiasm"
