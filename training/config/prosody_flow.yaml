# ProsodyFlow Training Configuration
# Conditional Flow Matching for Prosody Generation
#
# Based on ProsodyFlow (COLING 2025) and Matcha-TTS (ICASSP 2024)
# Reference: https://aclanthology.org/2025.coling-main.518/

# =============================================================================
# DATA
# =============================================================================
data_dir: ../data/splits
max_text_len: 128

# =============================================================================
# MODEL ARCHITECTURE
# =============================================================================

# Prosody dimensions (match ProsodyEncoder output)
prosody_dim: 2048
text_dim: 768  # BERT-like text encoder dimension

# Text conditioning
use_text_conditioning: true

# Flow matching settings
sigma_min: 0.001  # Minimum variance at t=1 (near-deterministic)

# Optimal Transport Conditional Flow Matching (OT-CFM)
# Creates straighter flows for faster inference
use_ot_coupling: true
ot_reg: 0.05  # Sinkhorn regularization
ot_normalize_cost: true

# Variance control for expressiveness
# Higher = more expressive, lower = more consistent
variance_scale: 1.0
min_variance: 0.1
max_variance: 2.0

# Network architecture
hidden_dim: 512
num_layers: 4
num_heads: 8
dropout: 0.1
use_sinusoidal_time_emb: true
time_emb_dim: 256

# Output tokens (compatible with ProsodyEncoder)
num_prosody_tokens: 4

# ODE solver settings
num_ode_steps: 50  # Integration steps for inference (more = better quality, slower)
ode_method: euler  # euler, midpoint, rk4

# =============================================================================
# TRAINING
# =============================================================================
epochs: 100
batch_size: 16
lr: 1e-4
weight_decay: 0.01
grad_clip: 1.0
warmup_steps: 1000

# Loss weights
cfm_weight: 1.0
reconstruction_weight: 0.0  # Optional reconstruction loss
kl_weight: 0.0  # Optional KL regularization

# Data loading
num_workers: 4

# Checkpointing
save_every: 10

# =============================================================================
# HARDWARE CONFIGS
# =============================================================================

# M4 Pro Mac (64GB) - conservative settings
# batch_size: 8
# num_workers: 2

# RTX 4090 (24GB VRAM) - can use larger batches
# batch_size: 32
# num_workers: 4
