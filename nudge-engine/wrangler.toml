name = "nudge-engine"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Cron: runs the nudge loop every 15 minutes
[triggers]
crons = ["*/15 * * * *"]

# D1 database — create with: npx wrangler d1 create nudge-engine-db
# Then paste your database_id below
[[d1_databases]]
binding = "DB"
database_name = "nudge-engine-db"
database_id = "f11f052d-42e9-4567-9694-ebb20e927981"

[vars]
ENVIRONMENT = "production"

# Set the admin key as a secret (not in this file):
#   npx wrangler secret put ADMIN_API_KEY
